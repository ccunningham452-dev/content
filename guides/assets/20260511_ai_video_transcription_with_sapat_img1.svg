<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Sapat video transcription workflow in Daytona</title>
  <desc id="desc">A workflow diagram showing a video file converted by FFmpeg, transcribed by Sapat through OpenAI, Groq, or Azure OpenAI, and saved as a text transcript.</desc>
  <rect width="1200" height="630" fill="#f7f9fc"/>
  <rect x="66" y="72" width="1068" height="486" rx="28" fill="#ffffff" stroke="#d8e2ee" stroke-width="2"/>
  <text x="100" y="132" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700" fill="#172033">AI video transcription with Sapat</text>
  <text x="100" y="170" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#526174">Run the same transcription workflow inside a reproducible Daytona workspace.</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="100" y="250" width="190" height="120" rx="18" fill="#eef5ff" stroke="#84aee8" stroke-width="2"/>
    <text x="195" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#173a67">Video file</text>
    <text x="195" y="334" text-anchor="middle" font-size="17" fill="#496276">mp4 directory or file</text>
    <path d="M315 310 H430" stroke="#62748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M430 310 l-14 -10 v20 z" fill="#62748b"/>
    <rect x="455" y="250" width="190" height="120" rx="18" fill="#eefaf3" stroke="#7bbf92" stroke-width="2"/>
    <text x="550" y="302" text-anchor="middle" font-size="24" font-weight="700" fill="#1f5b34">FFmpeg</text>
    <text x="550" y="334" text-anchor="middle" font-size="17" fill="#496276">convert to MP3</text>
    <path d="M670 310 H785" stroke="#62748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M785 310 l-14 -10 v20 z" fill="#62748b"/>
    <rect x="810" y="250" width="240" height="120" rx="18" fill="#fff7e8" stroke="#e4b45d" stroke-width="2"/>
    <text x="930" y="292" text-anchor="middle" font-size="24" font-weight="700" fill="#744d0b">Sapat CLI</text>
    <text x="930" y="324" text-anchor="middle" font-size="17" fill="#496276">OpenAI, Groq, Azure</text>
    <text x="930" y="350" text-anchor="middle" font-size="17" fill="#496276">optional LLM correction</text>
    <path d="M930 385 V455" stroke="#62748b" stroke-width="4" stroke-linecap="round"/>
    <path d="M930 455 l-10 -14 h20 z" fill="#62748b"/>
    <rect x="810" y="472" width="240" height="52" rx="14" fill="#f0edff" stroke="#9b8ae5" stroke-width="2"/>
    <text x="930" y="506" text-anchor="middle" font-size="22" font-weight="700" fill="#43328f">Transcript .txt</text>
  </g>
  <text x="100" y="514" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526174">Daytona keeps Python, FFmpeg, packages, and environment variables consistent across machines.</text>
</svg>
